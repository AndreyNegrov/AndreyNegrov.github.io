// ── PARTICLES ──
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: .02 + Math.random() * .03,
      size: 2 + Math.random() * 3,
      color,
    });
  }
}

function spawnExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: .015 + Math.random() * .025,
      size: 3 + Math.random() * 5,
      color,
    });
  }
}

// ── GAME LOOP ──
function update(dt) {
  const now = performance.now();
  const sdt = dt;

  if (isMulti() && !isHost) {
    // guest: update local particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * sdt; p.y += p.vy * sdt;
      p.vx *= .96; p.vy *= .96;
      p.life -= p.decay * sdt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    // guest: move visual-only projectiles locally
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      if (!p._visualOnly) continue;
      if (p.target && p.target.hp > 0 && p.target.spawned) {
        p.tx = p.target.x; p.ty = p.target.y;
      }
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 0.15) {
        spawnParticles(g2x(p.x), g2y(p.y), p.color, 4);
        projectiles.splice(i, 1);
        continue;
      }
      const step = p.speed * sdt;
      p.x += (dx / dist) * step;
      p.y += (dy / dist) * step;
    }
    return;
  }

  if (isMulti() && isHost) {
    for (const [key, data] of Object.entries(pendingIntents)) {
      if (data.playerId === clientId) continue;
      applyIntent(data);
      if (db && roomId) db.ref('rooms/' + roomId + '/intents/' + key).remove();
      delete pendingIntents[key];
    }
  }

  if (!waveActive && !gameOver && waveNum < TOTAL_WAVES && Date.now() >= nextWaveAt) {
    waveNum++;
    waveActive = true;
    const newEnemies = spawnWaveEnemies(waveNum);
    enemies.push(...newEnemies);
    nextWaveAt = Infinity;
    playSfx('waveStart', .7);
    updateUI();
  }

  // enemies
  let allDead = true;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const ePath = getPathFor(e);
    if (!e.spawned) {
      e.delay -= sdt * 16.667;
      if (e.delay <= 0) {
        e.spawned = true;
        const sp = ePath[0];
        e.x = sp.x; e.y = sp.y;
      } else {
        allDead = false;
        continue;
      }
    }
    if (e.hp <= 0) continue;
    allDead = false;

    let speed = e.speed;
    if (now < e.slowEnd) speed *= e.slow;

    e.pathT += speed * sdt * .02;
    if (e.pathT >= 1) {
      e.pathT = 0;
      e.pathIdx++;
    }

    if (e.pathIdx >= ePath.length - 1) {
      lives -= e.type === 'boss' ? 5 : 1;
      e.hp = 0;
      spawnParticles(g2x(e.x), g2y(e.y), '#ff3c5a', 8);
      playSfx('enemyReachBase', .6);
      if (lives <= 0) { lives = 0; endGame(); }
      updateUI();
      continue;
    }

    const p1 = ePath[e.pathIdx];
    const p2 = ePath[e.pathIdx + 1];
    e.x = p1.x + (p2.x - p1.x) * e.pathT;
    e.y = p1.y + (p2.y - p1.y) * e.pathT;
  }

  enemies = enemies.filter(e => e.hp > 0 || !e.spawned);

  if (waveActive && allDead && enemies.every(e => e.spawned)) {
    waveActive = false;
    nextWaveAt = Date.now() + WAVE_INTERVAL;
    if (isMulti()) {
      const bonus = 18 + Math.floor(waveNum * 1.5);
      goldHost += bonus;
      goldGuest += bonus;
    } else {
      gold += 32 + waveNum * 3;
    }
    playSfx('waveComplete', .6);
    updateUI();
    if (waveNum >= TOTAL_WAVES) {
      setTimeout(() => {
        gameOver = true;
        if (isMulti() && isHost && db && roomId) db.ref('rooms/' + roomId + '/state').update({ gameOver: true });
        document.getElementById('game-over').querySelector('.go-title').textContent = 'Victory!';
        document.getElementById('game-over').querySelector('.go-sub').textContent = 'Your fortress stands strong';
        document.getElementById('goStats').textContent = `Survived all ${TOTAL_WAVES} waves with ${lives} lives remaining`;
        document.getElementById('game-over').classList.add('visible');
        playSfx('victory', .8);
        stopMusic();
      }, 1000);
    }
  }

  updateMusicTrack();

  // towers fire
  for (const t of towers) {
    const type = TOWER_TYPES.find(tp => tp.id === t.typeId);
    const tcx = t.col + .5, tcy = t.row + .5;

    let best = null, bestDist = Infinity;
    for (const e of enemies) {
      if (!e.spawned || e.hp <= 0) continue;
      const d = Math.hypot(e.x - tcx, e.y - tcy);
      const eProgress = (e.pathIdx + e.pathT) / getPathFor(e).length;
      const bestProgress = best ? (best.pathIdx + best.pathT) / getPathFor(best).length : -1;
      if (d < t.range && eProgress > bestProgress) {
        best = e;
      }
    }
    t.target = best;
    if (best) {
      t.angle = Math.atan2(best.y - tcy, best.x - tcx);
    }

    const ownerId = t.ownerId || 'host';
    if (type.beam && best) {
      t.lastFire = now;
      const d = t.damage * sdt;
      best.hp -= d;
      if (isMulti()) { if (ownerId === 'host') best.damageFromHost = (best.damageFromHost || 0) + d; else best.damageFromGuest = (best.damageFromGuest || 0) + d; }
      if (best.hp <= 0) {
        addRewardByContribution(best);
        spawnExplosion(g2x(best.x), g2y(best.y), best.color, 15);
        playSfx('enemyDeath', .4);
        updateUI();
      }
    } else if (type.id === 'machinegun' && best) {
      // непрерывная стрельба - урон каждый кадр, визуальные эффекты каждые 50мс
      const d = t.damage * sdt * 4;
      best.hp -= d;
      if (isMulti()) { if (ownerId === 'host') best.damageFromHost = (best.damageFromHost||0)+d; else best.damageFromGuest = (best.damageFromGuest||0)+d; }
      if (best.hp <= 0) { addRewardByContribution(best); spawnExplosion(g2x(best.x), g2y(best.y), best.color, 15); playSfx('enemyDeath', .4); updateUI(); }
      if (now - t.lastFire >= t.fireRate) {
        t.lastFire = now;
        playShot(type.id);
        // hitscan: мгновенное попадание + вспышка из дула + рикошеты от цели
        const a = t.angle || 0;
        const cosA = Math.cos(a), sinA = Math.sin(a);
        const perpX = -sinA, perpY = cosA;
        // вспышка из кончиков стволов
        const towerR = CELL * 1.3 * 0.4;
        const lv = t.level || 0;
        const lvScale = 1 + lv * 0.1;
        const bodyH = towerR * (0.48 + lv * 0.06) * lvScale;
        const bLen = towerR * (0.75 + lv * 0.06) * lvScale;
        const bTip = (towerR * 0.05 + bLen) * lvScale;
        const bSpacing = towerR * 0.1 * lvScale;
        const rcx = g2x(tcx), rcy = g2y(tcy) - bodyH;
        for (let i = 0; i < 2; i++) {
          const by = (i - 0.5) * bSpacing;
          const mx = rcx + cosA * bTip - sinA * by;
          const my = rcy + sinA * bTip + cosA * by;
          for (let j = 0; j < 5; j++) {
            const fa = a + (Math.random() - 0.5) * 0.5;
            const fs = 2 + Math.random() * 5;
            particles.push({ x: mx, y: my, vx: Math.cos(fa)*fs, vy: Math.sin(fa)*fs, life: 1, decay: 0.12 + Math.random()*0.1, size: 1.5 + Math.random()*2.5, color: ['#fff','#ffdd44','#ffaa33','#ff8822'][Math.floor(Math.random()*4)] });
          }
        }
        const hitX = g2x(best.x), hitY = g2y(best.y);
        const bounceCount = 14 + Math.floor(Math.random() * 8);
        for (let j = 0; j < bounceCount; j++) {
          const ba = Math.random() * Math.PI * 2;
          const bs = 1.5 + Math.random() * 6;
          const bcolor = ['#ffcc44','#ff8833','#ffee66','#ff6622'][Math.floor(Math.random()*4)];
          particles.push({ x: hitX, y: hitY, vx: Math.cos(ba)*bs, vy: Math.sin(ba)*bs, life: 1, decay: 0.04 + Math.random()*0.05, size: 0.8 + Math.random()*1.5, color: bcolor });
        }
      }
    } else if (best && now - t.lastFire >= t.fireRate) {
        t.lastFire = now;
        playShot(type.id);
        projectiles.push({
          id: 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          x: tcx, y: tcy,
          tx: best.x, ty: best.y,
          target: best,
          speed: type.projSpeed * .03,
          damage: t.damage,
          color: type.projColor,
          splash: type.splash || 0,
          slow: type.slow || 0,
          slowDur: type.slowDur || 0,
          ownerId,
          typeId: type.id,
        });
      }

    if (type.beam && best && now - t.lastFire < 200) {
      const d = t.damage * sdt * .06;
      best.hp -= d;
      if (isMulti()) { const ownerId = t.ownerId || 'host'; if (ownerId === 'host') best.damageFromHost = (best.damageFromHost || 0) + d; else best.damageFromGuest = (best.damageFromGuest || 0) + d; }
      if (best.hp <= 0) {
        addRewardByContribution(best);
        spawnExplosion(g2x(best.x), g2y(best.y), best.color, 15);
        playSfx('enemyDeath', .4);
        updateUI();
      }
    }
    if (type.id === 'machinegun' && best && now - t.lastFire < 100) {
      // непрерывные визуальные эффекты пока стреляем
      const a = t.angle || 0;
      const cosA = Math.cos(a), sinA = Math.sin(a);
      const perpX = -sinA, perpY = cosA;
      const towerR = CELL * 1.3 * 0.4;
      const lv = t.level || 0;
      const lvScale = 1 + lv * 0.1;
      const bodyH = towerR * (0.48 + lv * 0.06) * lvScale;
      const bLen = towerR * (0.75 + lv * 0.06) * lvScale;
      const bTip = (towerR * 0.05 + bLen) * lvScale;
      const bSpacing = towerR * 0.1 * lvScale;
      const rcx = g2x(tcx), rcy = g2y(tcy) - bodyH;
      if (Math.random() > 0.7) {
        for (let i = 0; i < 2; i++) {
          const by = (i - 0.5) * bSpacing;
          const mx = rcx + cosA * bTip - sinA * by;
          const my = rcy + sinA * bTip + cosA * by;
          for (let j = 0; j < 2; j++) {
            const fa = a + (Math.random() - 0.5) * 0.4;
            const fs = 2 + Math.random() * 4;
            particles.push({ x: mx, y: my, vx: Math.cos(fa)*fs, vy: Math.sin(fa)*fs, life: 1, decay: 0.12 + Math.random()*0.1, size: 1 + Math.random()*2, color: ['#fff','#ffaa33'][Math.floor(Math.random()*2)] });
          }
        }
      }
      if (Math.random() > 0.8) {
        const hitX = g2x(best.x), hitY = g2y(best.y);
        for (let j = 0; j < 3; j++) {
          const ba = Math.random() * Math.PI * 2;
          const bs = 1.5 + Math.random() * 4;
          particles.push({ x: hitX, y: hitY, vx: Math.cos(ba)*bs, vy: Math.sin(ba)*bs, life: 1, decay: 0.04 + Math.random()*0.05, size: 0.8 + Math.random()*1.2, color: ['#ffcc44','#ff8833'][Math.floor(Math.random()*2)] });
        }
      }
    }
  }

  // projectiles (all coords in grid units)
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.target && p.target.hp > 0) {
      p.tx = p.target.x; p.ty = p.target.y;
    }
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < .15) {
      const ownerId = p.ownerId || 'host';
      const addDamageToEnemy = (e, dmg) => {
        if (isMulti()) { if (ownerId === 'host') e.damageFromHost = (e.damageFromHost || 0) + dmg; else e.damageFromGuest = (e.damageFromGuest || 0) + dmg; }
      };
      const addSlowToEnemy = (e, dur) => {
        if (isMulti()) { if (ownerId === 'host') e.slowFromHost = (e.slowFromHost || 0) + dur; else e.slowFromGuest = (e.slowFromGuest || 0) + dur; }
      };
      const onKill = (e) => { addRewardByContribution(e); spawnExplosion(g2x(e.x), g2y(e.y), e.color, 15); playSfx('enemyDeath', .4); updateUI(); };
      if (p.splash > 0) {
        for (const e of enemies) {
          if (!e.spawned || e.hp <= 0) continue;
          if (Math.hypot(e.x - p.x, e.y - p.y) < p.splash) {
            e.hp -= p.damage;
            addDamageToEnemy(e, p.damage);
            if (p.slow) { e.slow = p.slow; e.slowEnd = now + p.slowDur; addSlowToEnemy(e, p.slowDur); }
            if (e.hp <= 0) onKill(e);
          }
        }
        spawnExplosion(g2x(p.x), g2y(p.y), p.color, 10);
      } else if (p.target && p.target.hp > 0) {
        p.target.hp -= p.damage;
        addDamageToEnemy(p.target, p.damage);
        if (p.slow) { p.target.slow = p.slow; p.target.slowEnd = now + p.slowDur; addSlowToEnemy(p.target, p.slowDur); }
        if (p.target.hp <= 0) onKill(p.target);
        spawnParticles(g2x(p.x), g2y(p.y), p.color, 4);
      }
      projectiles.splice(i, 1);
      continue;
    }
    const s = p.speed * sdt;
    p.x += (dx / dist) * s;
    p.y += (dy / dist) * s;
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * sdt;
    p.y += p.vy * sdt;
    p.vx *= .96;
    p.vy *= .96;
    p.life -= p.decay * sdt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (isMulti() && isHost && db && roomId) writeStateToFirebase();
}

function applyIntent(data) {
  if (data.type === 'placeTower') {
    const type = TOWER_TYPES.find(t => t.id === data.typeId);
    if (!type || goldGuest < type.cost) return;
    if (isPath(data.col, data.row)) return;
    if (towers.some(t => t.col === data.col && t.row === data.row)) return;
    goldGuest -= type.cost;
    const t = {
      id: 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      typeId: type.id, col: data.col, row: data.row,
      damage: type.damage, range: type.range, fireRate: type.fireRate, projSpeed: type.projSpeed,
      level: 0, lastFire: 0, target: null, angle: 0, ownerId: 'guest',
    };
    towers.push(t);
    updateUI();
  } else if (data.type === 'upgradeTower') {
    const tower = towers.find(t => t.id === data.towerId);
    if (!tower || tower.ownerId !== 'guest') return;
    const tp = TOWER_TYPES.find(t => t.id === tower.typeId);
    const cost = Math.floor(tp.cost * Math.pow(UPGRADE_COST_MULT, tower.level));
    if (goldGuest < cost) return;
    goldGuest -= cost;
    tower.level++;
    tower.damage *= UPGRADE_MULT.damage;
    tower.range *= UPGRADE_MULT.range;
    tower.fireRate *= UPGRADE_MULT.fireRate;
    updateUI();
  } else if (data.type === 'sellTower') {
    const tower = towers.find(t => t.id === data.towerId);
    if (!tower || tower.ownerId !== 'guest') return;
    const tp = TOWER_TYPES.find(t => t.id === tower.typeId);
    const sellVal = Math.floor(tp.cost * (tower.level + 1) * .6);
    goldGuest += sellVal;
    towers = towers.filter(t => t !== tower);
    updateUI();
  } else if (data.type === 'restart') {
    initGame();
  }
}

function writeStateToFirebase() {
  const state = { lives, waveNum, waveActive, gameOver, goldHost, goldGuest, nextWaveAt: Number.isFinite(nextWaveAt) ? nextWaveAt : null };
  const towersObj = {};
  towers.forEach(t => {
    const o = { typeId: t.typeId, col: t.col, row: t.row, damage: t.damage, range: t.range, fireRate: t.fireRate, projSpeed: t.projSpeed, level: t.level, lastFire: t.lastFire, angle: t.angle, ownerId: t.ownerId || 'host', targetId: (t.target && t.target.id) || null };
    towersObj[t.id] = o;
  });
  const enemiesObj = {};
  enemies.forEach(e => {
    const o = { hp: e.hp, maxHp: e.maxHp, speed: e.speed, pathIdx: e.pathIdx, pathT: e.pathT, reward: e.reward, slow: e.slow, slowEnd: e.slowEnd, delay: e.delay, spawned: e.spawned, size: e.size, color: e.color, type: e.type, variant: e.variant || 'runner', damageFromHost: e.damageFromHost || 0, damageFromGuest: e.damageFromGuest || 0, pathId: e.pathId || 'A' };
    enemiesObj[e.id || ('e_' + Math.random())] = o;
  });
  const projectilesObj = {};
  projectiles.forEach(p => {
    const o = { x: p.x, y: p.y, tx: p.tx, ty: p.ty, speed: p.speed, damage: p.damage, color: p.color, splash: p.splash || 0, slow: p.slow || 0, slowDur: p.slowDur || 0, ownerId: p.ownerId || 'host', targetId: (p.target && p.target.id) || null, typeId: p.typeId || null };
    projectilesObj[p.id || ('p_' + Math.random())] = o;
  });
  db.ref('rooms/' + roomId).update({ state, towers: towersObj, enemies: enemiesObj, projectiles: projectilesObj });
}

function applySnapshot(data) {
  if (!data || !data.state) return;
  const s = data.state;
  lives = s.lives ?? lives;
  waveNum = s.waveNum ?? waveNum;
  waveActive = s.waveActive ?? waveActive;
  gameOver = s.gameOver ?? gameOver;
  goldHost = s.goldHost ?? goldHost;
  goldGuest = s.goldGuest ?? goldGuest;
  gold = myGold();
  nextWaveAt = (s.nextWaveAt != null && Number.isFinite(s.nextWaveAt)) ? s.nextWaveAt : (waveActive ? Infinity : Date.now() + WAVE_INTERVAL);

  if (data.towers) {
    const oldTowers = new Map(towers.map(t => [t.id, t]));
    const localNow = performance.now();
    towers = Object.entries(data.towers)
      .filter(([id, v]) => v && (v.typeId || (oldTowers.get(id) && oldTowers.get(id).typeId)))
      .map(([id, v]) => {
      const old = oldTowers.get(id);
      const t = { ...v, id, target: null };
      if (!t.typeId && old) t.typeId = old.typeId;
      // detect fire events: if host lastFire changed, remap to local time
      const hostLF = v.lastFire || 0;
      const prevHostLF = old ? (old._hostLastFire || 0) : 0;
      if (hostLF > 0 && hostLF !== prevHostLF) {
        t.lastFire = localNow;
        t._hostLastFire = hostLF;
        t._justFired = true;
      } else if (old) {
        t.lastFire = old.lastFire || 0;
        t._hostLastFire = prevHostLF;
      } else {
        t.lastFire = 0;
        t._hostLastFire = 0;
      }
      return t;
    });

    // spawn local visual projectiles on guest for towers that just fired
    if (!isHost) {
      for (const t of towers) {
        if (!t._justFired || !t.targetId) continue;
        t._justFired = false;
        const type = TOWER_TYPES.find(tp => tp.id === t.typeId);
        if (!type || type.beam) continue;
        const target = enemies.find(e => e.id === t.targetId);
        if (!target || target.hp <= 0) continue;
        const tcx = t.col + 0.5, tcy = t.row + 0.5;
        if (type.id === 'machinegun') {
          const a = t.angle || 0;
          const cosA = Math.cos(a), sinA = Math.sin(a);
          const perpX = -sinA, perpY = cosA;
          const towerR = CELL * 1.3 * 0.4;
          const lv = t.level || 0;
          const lvScale = 1 + lv * 0.1;
          const bodyH = towerR * (0.48 + lv * 0.06) * lvScale;
          const bLen = towerR * (0.75 + lv * 0.06) * lvScale;
          const bTip = (towerR * 0.05 + bLen) * lvScale;
          const bSpacing = towerR * 0.1 * lvScale;
          const rcx = g2x(tcx), rcy = g2y(tcy) - bodyH;
          for (let bi = 0; bi < 2; bi++) {
            const by = (bi - 0.5) * bSpacing;
            const mx = rcx + cosA * bTip - sinA * by;
            const my = rcy + sinA * bTip + cosA * by;
            for (let j = 0; j < 5; j++) {
              const fa = a + (Math.random() - 0.5) * 0.5;
              const fs = 2 + Math.random() * 5;
              particles.push({ x: mx, y: my, vx: Math.cos(fa)*fs, vy: Math.sin(fa)*fs, life: 1, decay: 0.12 + Math.random()*0.1, size: 1.5 + Math.random()*2.5, color: ['#fff','#ffdd44','#ffaa33','#ff8822'][Math.floor(Math.random()*4)] });
            }
          }
          const hitX = g2x(target.x), hitY = g2y(target.y);
          for (let j = 0; j < 16; j++) {
            const ba = Math.random() * Math.PI * 2;
            const bs = 1.5 + Math.random() * 6;
            particles.push({ x: hitX, y: hitY, vx: Math.cos(ba)*bs, vy: Math.sin(ba)*bs, life: 1, decay: 0.04 + Math.random()*0.05, size: 0.8 + Math.random()*1.5, color: ['#ffcc44','#ff8833','#ffee66','#ff6622'][Math.floor(Math.random()*4)] });
          }
        } else {
          projectiles.push({
            id: 'vp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            x: tcx, y: tcy,
            tx: target.x, ty: target.y,
            target,
            speed: (type.projSpeed || 5) * .03,
            damage: 0,
            color: type.projColor,
            splash: 0, slow: 0, slowDur: 0,
            ownerId: t.ownerId || 'host',
            _visualOnly: true,
            typeId: type.id,
          });
        }
        playShot(type.id);
      }
    }
  }
  if (data.enemies) {
    enemies = Object.entries(data.enemies).map(([id, v]) => {
      const e = { ...v, id, slowEnd: 0 };
      if (!e.pathId) e.pathId = 'A';
      const ep = getPathFor(e);
      if (e.spawned && e.pathIdx < ep.length - 1) {
        const p1 = ep[e.pathIdx];
        const p2 = ep[e.pathIdx + 1];
        e.x = p1.x + (p2.x - p1.x) * e.pathT;
        e.y = p1.y + (p2.y - p1.y) * e.pathT;
      } else if (e.spawned && e.pathIdx >= ep.length - 1 && ep.length) {
        const last = ep[ep.length - 1];
        e.x = last.x;
        e.y = last.y;
      } else {
        e.x = 0; e.y = 0;
      }
      return e;
    });
  }
  if (data.projectiles) {
    const visualOnly = projectiles.filter(p => p._visualOnly);
    projectiles = [
      ...Object.entries(data.projectiles).map(([id, v]) => ({ ...v, id })),
      ...visualOnly,
    ];
  }

  // link tower targets to enemy objects for beam rendering
  if (data.towers) {
    for (const t of towers) {
      if (t.targetId) {
        t.target = enemies.find(e => e.id === t.targetId) || null;
      }
    }
  }
  // link projectile targets to enemy objects
  if (data.projectiles) {
    for (const p of projectiles) {
      if (p.targetId) {
        p.target = enemies.find(e => e.id === p.targetId) || null;
      }
    }
  }

  document.getElementById('wave-btn').style.display = 'none';

  if (gameOver) {
    if (waveNum >= TOTAL_WAVES) {
      document.getElementById('game-over').querySelector('.go-title').textContent = 'Victory!';
      document.getElementById('game-over').querySelector('.go-sub').textContent = 'Your fortress stands strong';
      document.getElementById('goStats').textContent = `Survived all ${TOTAL_WAVES} waves with ${lives} lives remaining`;
    } else {
      document.getElementById('game-over').querySelector('.go-title').textContent = 'Game Over';
      document.getElementById('game-over').querySelector('.go-sub').textContent = 'Your fortress has fallen';
      document.getElementById('goStats').textContent = `Survived ${waveNum} waves`;
    }
    document.getElementById('game-over').classList.add('visible');
  } else {
    document.getElementById('game-over').classList.remove('visible');
  }

  if (!document.getElementById('shop').children.length) buildShop();
  updateUI();
}

// ── ENEMY DRAWING — menacing, angular sci-fi creatures ──
function drawEnemy(cx, cy, radius, color, darkColor, now, walkPhase, facing, isBoss, isSlowed, variant) {
  const r = radius;
  const bounce = Math.abs(Math.sin(walkPhase * 2.5)) * r * 0.04;

  ctx.save();
  ctx.translate(cx, cy);

  // ground shadow
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(1, r * 0.42, r * 0.7, r * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.translate(0, -bounce);
  ctx.scale(facing, 1);

  const bg = ctx.createRadialGradient(-r * 0.15, -r * 0.25, 0, 0, 0, r);
  bg.addColorStop(0, lightenColor(color, 0.2));
  bg.addColorStop(0.5, color);
  bg.addColorStop(1, darkColor);

  if (isBoss) {
    // ═══ BOSS — heavily armored war construct ═══
    const p = Math.sin(now * 0.004) * 0.15 + 0.85;
    // menacing aura
    ctx.save(); ctx.globalAlpha = p * 0.18;
    const ag = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 1.6);
    ag.addColorStop(0, color); ag.addColorStop(1, 'transparent');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // body — angular armored chassis
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-r * 0.85, r * 0.3);
    ctx.lineTo(-r * 1.0, -r * 0.1);
    ctx.lineTo(-r * 0.9, -r * 0.5);
    ctx.lineTo(-r * 0.55, -r * 0.85);
    ctx.quadraticCurveTo(0, -r * 1.0, r * 0.55, -r * 0.85);
    ctx.lineTo(r * 0.9, -r * 0.5);
    ctx.lineTo(r * 1.0, -r * 0.1);
    ctx.lineTo(r * 0.85, r * 0.3);
    ctx.quadraticCurveTo(0, r * 0.5, -r * 0.85, r * 0.3);
    ctx.fill();
    // armor plate seams
    ctx.strokeStyle = darkenColor(color, 0.35); ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-r * 0.7, -r * 0.5); ctx.lineTo(-r * 0.75, r * 0.15);
    ctx.moveTo(r * 0.7, -r * 0.5); ctx.lineTo(r * 0.75, r * 0.15);
    ctx.stroke();
    // center seam
    ctx.strokeStyle = lightenColor(color, 0.15); ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(0, -r * 0.85); ctx.lineTo(0, r * 0.2); ctx.stroke();
    // shoulder armor
    for (let sd = -1; sd <= 1; sd += 2) {
      ctx.fillStyle = darkenColor(color, 0.2);
      ctx.beginPath();
      ctx.moveTo(sd * r * 0.6, -r * 0.55);
      ctx.lineTo(sd * r * 1.1, -r * 0.45);
      ctx.lineTo(sd * r * 1.05, -r * 0.25);
      ctx.lineTo(sd * r * 0.7, -r * 0.2);
      ctx.closePath(); ctx.fill();
      // shoulder edge
      ctx.strokeStyle = lightenColor(color, 0.2); ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(sd * r * 0.6, -r * 0.55); ctx.lineTo(sd * r * 1.1, -r * 0.45); ctx.stroke();
      // spike
      ctx.fillStyle = darkenColor(color, 0.1);
      ctx.beginPath();
      ctx.moveTo(sd * r * 0.85, -r * 0.5);
      ctx.lineTo(sd * r * 1.2, -r * 0.85);
      ctx.lineTo(sd * r * 1.0, -r * 0.38);
      ctx.fill();
    }
    // horns — sharp, angular
    for (let sd = -1; sd <= 1; sd += 2) {
      const hG = ctx.createLinearGradient(sd * r * 0.25, -r * 0.85, sd * r * 0.6, -r * 1.4);
      hG.addColorStop(0, '#1a0e0e'); hG.addColorStop(1, '#3a2020');
      ctx.fillStyle = hG;
      ctx.beginPath();
      ctx.moveTo(sd * r * 0.2, -r * 0.85);
      ctx.lineTo(sd * r * 0.55, -r * 1.45);
      ctx.lineTo(sd * r * 0.38, -r * 0.82);
      ctx.closePath(); ctx.fill();
    }
    // face visor
    ctx.fillStyle = darkenColor(color, 0.45);
    ctx.beginPath();
    ctx.moveTo(-r * 0.32, -r * 0.7);
    ctx.lineTo(0, -r * 0.78);
    ctx.lineTo(r * 0.32, -r * 0.7);
    ctx.lineTo(r * 0.28, -r * 0.2);
    ctx.quadraticCurveTo(0, -r * 0.1, -r * 0.28, -r * 0.2);
    ctx.closePath(); ctx.fill();
    // visor slit eyes
    for (let sd = -1; sd <= 1; sd += 2) {
      ctx.fillStyle = '#ff1a1a';
      ctx.shadowColor = '#ff2222'; ctx.shadowBlur = 10 * p;
      ctx.beginPath();
      ctx.moveTo(sd * r * 0.05, -r * 0.5);
      ctx.lineTo(sd * r * 0.25, -r * 0.48);
      ctx.lineTo(sd * r * 0.22, -r * 0.42);
      ctx.lineTo(sd * r * 0.06, -r * 0.44);
      ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur = 0;
    // jaw vents
    ctx.fillStyle = darkenColor(color, 0.5);
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(-r * 0.18 + i * r * 0.1, -r * 0.2, r * 0.06, r * 0.03);
    }
    // specular highlight
    ctx.save(); ctx.globalAlpha = 0.12;
    const bhlG = ctx.createLinearGradient(-r * 0.4, -r, r * 0.1, -r * 0.2);
    bhlG.addColorStop(0, '#fff'); bhlG.addColorStop(1, 'transparent');
    ctx.fillStyle = bhlG;
    ctx.fillRect(-r * 0.5, -r * 0.9, r * 0.45, r * 0.65);
    ctx.restore();

  } else if (variant === 'tank') {
    // ═══ TANK — armored siege crawler ═══
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-r * 1.05, r * 0.12);
    ctx.lineTo(-r * 1.1, -r * 0.25);
    ctx.lineTo(-r * 0.7, -r * 0.65);
    ctx.quadraticCurveTo(0, -r * 0.8, r * 0.7, -r * 0.65);
    ctx.lineTo(r * 1.1, -r * 0.25);
    ctx.lineTo(r * 1.05, r * 0.12);
    ctx.quadraticCurveTo(0, r * 0.38, -r * 1.05, r * 0.12);
    ctx.fill();
    // armor panel seams
    ctx.strokeStyle = darkenColor(color, 0.3); ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * 0.22, -r * 0.65 + Math.abs(i) * r * 0.12);
      ctx.lineTo(i * r * 0.26, r * 0.1);
      ctx.stroke();
    }
    // top plate highlight
    ctx.save(); ctx.globalAlpha = 0.15;
    const thlG = ctx.createRadialGradient(-r * 0.15, -r * 0.4, 0, 0, -r * 0.15, r * 0.6);
    thlG.addColorStop(0, '#fff'); thlG.addColorStop(1, 'transparent');
    ctx.fillStyle = thlG;
    ctx.beginPath();
    ctx.ellipse(-r * 0.08, -r * 0.35, r * 0.5, r * 0.3, -0.15, 0, Math.PI * 2);
    ctx.fill(); ctx.restore();
    // jaw pincers
    for (let sd = -1; sd <= 1; sd += 2) {
      ctx.fillStyle = darkenColor(color, 0.25);
      ctx.beginPath();
      ctx.moveTo(sd * r * 0.25, -r * 0.55);
      ctx.lineTo(sd * r * 0.5, -r * 0.85);
      ctx.lineTo(sd * r * 0.55, -r * 0.7);
      ctx.lineTo(sd * r * 0.3, -r * 0.48);
      ctx.closePath(); ctx.fill();
    }
    // sensor slits
    for (let sd = -1; sd <= 1; sd += 2) {
      ctx.fillStyle = '#eebb11';
      ctx.shadowColor = '#eebb11'; ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.moveTo(sd * r * 0.25, -r * 0.38);
      ctx.lineTo(sd * r * 0.5, -r * 0.35);
      ctx.lineTo(sd * r * 0.48, -r * 0.3);
      ctx.lineTo(sd * r * 0.26, -r * 0.33);
      ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur = 0;
    // track legs
    for (let sd = -1; sd <= 1; sd += 2) {
      for (let leg = 0; leg < 2; leg++) {
        const lx = sd * (r * 0.48 + leg * r * 0.32);
        const ly = r * 0.18 + Math.sin(walkPhase * 2 + leg * 1.5 + sd) * r * 0.03;
        ctx.fillStyle = darkenColor(color, 0.35);
        ctx.beginPath(); ctx.roundRect(lx - r * 0.1, ly - r * 0.05, r * 0.2, r * 0.1, 2); ctx.fill();
      }
    }

  } else if (variant === 'flyer') {
    // ═══ FLYER — angular drone with energy wings ═══
    const hover = Math.sin(now * 0.003) * r * 0.08;
    ctx.translate(0, hover - r * 0.15);
    // engine trail
    ctx.save(); ctx.globalAlpha = 0.12;
    const tg = ctx.createRadialGradient(0, r * 0.25, 0, 0, r * 0.25, r * 0.65);
    tg.addColorStop(0, color); tg.addColorStop(1, 'transparent');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(0, r * 0.25, r * 0.65, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // energy wings
    const wingFlap = Math.sin(now * 0.007) * 0.25;
    for (let sd = -1; sd <= 1; sd += 2) {
      ctx.save();
      ctx.translate(sd * r * 0.18, -r * 0.08);
      ctx.rotate(sd * (0.25 + wingFlap));
      // wing membrane
      const wG = ctx.createLinearGradient(0, 0, sd * r * 0.8, -r * 0.2);
      wG.addColorStop(0, lightenColor(color, 0.15));
      wG.addColorStop(1, colorAlpha(color, 0.27));
      ctx.fillStyle = wG;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(sd * r * 0.45, -r * 0.55);
      ctx.lineTo(sd * r * 0.85, -r * 0.1);
      ctx.lineTo(sd * r * 0.5, r * 0.05);
      ctx.closePath(); ctx.fill();
      // wing strut
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = lightenColor(color, 0.3); ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(sd * r * 0.7, -r * 0.25); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // body — angular hull
    const fb = ctx.createRadialGradient(-r * 0.08, -r * 0.12, 0, 0, 0, r * 0.5);
    fb.addColorStop(0, lightenColor(color, 0.3));
    fb.addColorStop(0.4, color);
    fb.addColorStop(1, darkColor);
    ctx.fillStyle = fb;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.52);
    ctx.lineTo(r * 0.38, -r * 0.3);
    ctx.lineTo(r * 0.35, r * 0.1);
    ctx.lineTo(r * 0.15, r * 0.4);
    ctx.lineTo(-r * 0.15, r * 0.4);
    ctx.lineTo(-r * 0.35, r * 0.1);
    ctx.lineTo(-r * 0.38, -r * 0.3);
    ctx.closePath(); ctx.fill();
    // hull edge
    ctx.strokeStyle = lightenColor(color, 0.15); ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(-r * 0.38, -r * 0.3); ctx.lineTo(0, -r * 0.52); ctx.lineTo(r * 0.38, -r * 0.3); ctx.stroke();
    // sensor eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, -r * 0.12, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = darkenColor(color, 0.45);
    ctx.beginPath(); ctx.arc(r * 0.02, -r * 0.1, r * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0a0a14';
    ctx.beginPath(); ctx.arc(r * 0.03, -r * 0.1, r * 0.055, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-r * 0.02, -r * 0.16, r * 0.03, 0, Math.PI * 2); ctx.fill();
    // top highlight
    ctx.save(); ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-r * 0.08, -r * 0.32, r * 0.12, r * 0.1, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

  } else if (variant === 'mage') {
    // ═══ MAGE — armored wraith with energy conduit ═══
    const float = Math.sin(now * 0.002) * r * 0.04;
    ctx.translate(0, float);
    // body — angular robes
    const mg = ctx.createLinearGradient(0, -r * 0.85, 0, r * 0.4);
    mg.addColorStop(0, lightenColor(color, 0.12));
    mg.addColorStop(0.35, color);
    mg.addColorStop(1, darkColor);
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.75);
    ctx.lineTo(r * 0.35, -r * 0.55);
    ctx.lineTo(r * 0.65, -r * 0.15);
    ctx.lineTo(r * 0.6, r * 0.2);
    ctx.quadraticCurveTo(r * 0.3, r * 0.4, 0, r * 0.35);
    ctx.quadraticCurveTo(-r * 0.3, r * 0.4, -r * 0.6, r * 0.2);
    ctx.lineTo(-r * 0.65, -r * 0.15);
    ctx.lineTo(-r * 0.35, -r * 0.55);
    ctx.closePath(); ctx.fill();
    // robe folds
    ctx.strokeStyle = darkenColor(color, 0.22); ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-r * 0.12, -r * 0.45); ctx.quadraticCurveTo(-r * 0.18, -r * 0.05, -r * 0.28, r * 0.3);
    ctx.moveTo(r * 0.08, -r * 0.4); ctx.quadraticCurveTo(r * 0.14, 0, r * 0.22, r * 0.3);
    ctx.stroke();
    // helmet/hood — angular
    ctx.fillStyle = darkenColor(color, 0.35);
    ctx.beginPath();
    ctx.moveTo(-r * 0.4, -r * 0.38);
    ctx.lineTo(-r * 0.35, -r * 0.75);
    ctx.quadraticCurveTo(0, -r * 1.0, r * 0.35, -r * 0.75);
    ctx.lineTo(r * 0.4, -r * 0.38);
    ctx.quadraticCurveTo(0, -r * 0.5, -r * 0.4, -r * 0.38);
    ctx.closePath(); ctx.fill();
    // face void
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.48, r * 0.2, r * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    // piercing eyes
    ctx.fillStyle = lightenColor(color, 0.55);
    ctx.shadowColor = color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(-r * 0.09, -r * 0.5, r * 0.04, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.09, -r * 0.5, r * 0.04, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // energy conduit (replaces wooden staff)
    ctx.strokeStyle = '#2a2848'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(r * 0.52, -r * 0.72); ctx.lineTo(r * 0.42, r * 0.32); ctx.stroke();
    ctx.strokeStyle = colorAlpha(color, 0.19); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(r * 0.52, -r * 0.72); ctx.lineTo(r * 0.42, r * 0.32); ctx.stroke();
    // conduit core
    const orbP = Math.sin(now * 0.005) * 0.3 + 0.7;
    const ocG = ctx.createRadialGradient(r * 0.52, -r * 0.76, 0, r * 0.52, -r * 0.76, r * 0.12);
    ocG.addColorStop(0, '#fff');
    ocG.addColorStop(0.3, lightenColor(color, 0.45));
    ocG.addColorStop(1, color);
    ctx.fillStyle = ocG;
    ctx.shadowColor = color; ctx.shadowBlur = 12 * orbP;
    ctx.beginPath(); ctx.arc(r * 0.52, -r * 0.76, r * 0.09, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // energy particles
    for (let i = 0; i < 3; i++) {
      const a = now * 0.004 + i * 2.1;
      const mx = r * 0.52 + Math.cos(a) * r * 0.18;
      const my = -r * 0.76 + Math.sin(a) * r * 0.18;
      ctx.globalAlpha = 0.4 + Math.sin(now * 0.006 + i) * 0.25;
      ctx.fillStyle = lightenColor(color, 0.5);
      ctx.beginPath(); ctx.arc(mx, my, 1.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

  } else {
    // ═══ RUNNER — agile predator ═══
    const lean = Math.sin(walkPhase * 2) * 0.08;
    ctx.rotate(lean);
    // streamlined body
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-r * 0.45, r * 0.18);
    ctx.lineTo(-r * 0.55, -r * 0.15);
    ctx.lineTo(-r * 0.4, -r * 0.55);
    ctx.quadraticCurveTo(-r * 0.15, -r * 0.8, r * 0.15, -r * 0.7);
    ctx.lineTo(r * 0.4, -r * 0.5);
    ctx.lineTo(r * 0.5, -r * 0.15);
    ctx.lineTo(r * 0.45, r * 0.12);
    ctx.quadraticCurveTo(0, r * 0.35, -r * 0.45, r * 0.18);
    ctx.fill();
    // body highlight
    ctx.save(); ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-r * 0.05, -r * 0.4, r * 0.22, r * 0.15, -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // dorsal ridge
    ctx.strokeStyle = lightenColor(color, 0.18); ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-r * 0.1, -r * 0.65);
    ctx.quadraticCurveTo(r * 0.1, -r * 0.75, r * 0.3, -r * 0.55);
    ctx.stroke();
    // tail — segmented
    ctx.strokeStyle = darkColor; ctx.lineWidth = r * 0.1; ctx.lineCap = 'round';
    const tailWag = Math.sin(walkPhase * 3) * 0.3;
    ctx.beginPath();
    ctx.moveTo(-r * 0.4, r * 0.12);
    ctx.quadraticCurveTo(-r * 0.7, r * 0.05 + tailWag * r * 0.15, -r * 0.85, -r * 0.08 + tailWag * r * 0.12);
    ctx.stroke();
    // tail tip
    ctx.fillStyle = lightenColor(color, 0.1);
    ctx.beginPath(); ctx.arc(-r * 0.85, -r * 0.08 + tailWag * r * 0.12, r * 0.04, 0, Math.PI * 2); ctx.fill();
    // legs (mechanical feel)
    ctx.lineWidth = r * 0.09; ctx.strokeStyle = darkColor;
    for (let sd = -1; sd <= 1; sd += 2) {
      const lx = sd * r * 0.18 + Math.sin(walkPhase * 2.5 + sd) * sd * r * 0.08;
      ctx.beginPath(); ctx.moveTo(lx, r * 0.08);
      ctx.lineTo(lx + sd * r * 0.08, r * 0.22);
      ctx.lineTo(lx + sd * r * 0.14, r * 0.34);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
    // head crest — sharper
    ctx.fillStyle = lightenColor(color, 0.12);
    ctx.beginPath();
    ctx.moveTo(r * 0.08, -r * 0.65);
    ctx.lineTo(r * 0.2, -r * 0.92);
    ctx.lineTo(r * 0.32, -r * 0.58);
    ctx.closePath(); ctx.fill();
    // predator eyes — narrow slits
    for (let sd = -1; sd <= 1; sd += 2) {
      const ex = r * 0.15 + sd * r * 0.1;
      const ey = -r * 0.46;
      ctx.fillStyle = '#ffe030';
      ctx.shadowColor = '#ffe030'; ctx.shadowBlur = 3;
      ctx.beginPath();
      ctx.moveTo(ex - r * 0.07, ey);
      ctx.lineTo(ex, ey - r * 0.08);
      ctx.lineTo(ex + r * 0.07, ey);
      ctx.lineTo(ex, ey + r * 0.06);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(ex + r * 0.01, ey, r * 0.02, r * 0.05, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  ctx.restore();

  // frost overlay
  if (isSlowed) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = 0.18;
    const fg = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.1);
    fg.addColorStop(0, '#aaf0ff'); fg.addColorStop(1, 'transparent');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ccf8ff';
    for (let i = 0; i < 5; i++) {
      const a = now * 0.003 + i * 1.257;
      ctx.globalAlpha = 0.4 + Math.sin(now * 0.005 + i * 1.7) * 0.25;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.5, 1.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// ── TOWER DRAWING — refined industrial sci-fi aesthetic ──
function drawTower(cx, cy, cellSize, type, level, angle, now, ownerTint) {
  const s = cellSize;
  const r = s * 0.4;
  const clr = type.color;
  const pulse = Math.sin(now * 0.003) * 0.15 + 0.85;
  const lv = level;

  ctx.save();
  ctx.translate(cx, cy);

  // ── scale factor: tower visibly grows with level ──
  const lvScale = 1 + lv * 0.1;
  ctx.scale(lvScale, lvScale);

  // ── ground glow (bigger & brighter at higher levels) ──
  const glowR = r * (1.0 + lv * 0.15);
  const glowAlpha = ['22','33','44','55','66'][lv] || '66';
  const glowMid   = ['0a','14','1e','28','33'][lv] || '33';
  const gGlow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, glowR);
  gGlow.addColorStop(0, clr + glowAlpha);
  gGlow.addColorStop(0.5, clr + glowMid);
  gGlow.addColorStop(1, clr + '00');
  ctx.fillStyle = gGlow;
  ctx.beginPath(); ctx.arc(0, 0, glowR, 0, Math.PI * 2); ctx.fill();

  // ── ground shadow ──
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(2, r * 0.25, r * (0.85 + lv * 0.05), r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── hexagonal base plate ──
  const baseR = r * (0.88 + lv * 0.04);
  const baseDepth = r * 0.12;
  // level-dependent base brightness
  const baseBright = Math.min(lv * 8, 30);
  const baseClrA = `rgb(${42 + baseBright},${42 + baseBright},${78 + baseBright})`;
  const baseClrB = `rgb(${54 + baseBright},${54 + baseBright},${88 + baseBright})`;
  const baseClrC = `rgb(${30 + baseBright},${30 + baseBright},${58 + baseBright})`;
  // side depth
  ctx.fillStyle = '#0c0c1e';
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + (i / 6) * Math.PI * 2;
    const hx = Math.cos(a) * baseR, hy = Math.sin(a) * baseR * 0.35 + baseDepth;
    i === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
  }
  ctx.closePath(); ctx.fill();
  // top surface
  const bpG = ctx.createLinearGradient(-baseR, -baseR * 0.3, baseR, baseR * 0.3);
  bpG.addColorStop(0, baseClrA); bpG.addColorStop(0.5, baseClrB); bpG.addColorStop(1, baseClrC);
  ctx.fillStyle = bpG;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + (i / 6) * Math.PI * 2;
    const hx = Math.cos(a) * baseR, hy = Math.sin(a) * baseR * 0.35;
    i === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
  }
  ctx.closePath(); ctx.fill();
  // hex edge — brighter at higher levels
  const edgeAlpha = ['55','77','99','bb','dd'][lv] || 'dd';
  ctx.strokeStyle = clr + edgeAlpha; ctx.lineWidth = 1.2 + lv * 0.4;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + (i / 6) * Math.PI * 2;
    const hx = Math.cos(a) * baseR, hy = Math.sin(a) * baseR * 0.35;
    i === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
  }
  ctx.closePath(); ctx.stroke();
  // inner hex accent
  if (lv >= 1) {
    ctx.strokeStyle = clr + '30'; ctx.lineWidth = 0.5;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 6 + (i / 6) * Math.PI * 2;
      const hx = Math.cos(a) * baseR * 0.65, hy = Math.sin(a) * baseR * 0.23;
      i === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
    }
    ctx.closePath(); ctx.stroke();
  }

  // ── level star pips on base ──
  if (lv >= 1) {
    ctx.save();
    ctx.globalAlpha = 0.7 + pulse * 0.2;
    ctx.fillStyle = clr;
    ctx.shadowColor = clr; ctx.shadowBlur = 4;
    for (let i = 0; i < lv; i++) {
      const sa = ((i - (lv - 1) / 2) * 0.65) - Math.PI / 2;
      const sx = Math.cos(sa) * baseR * 0.6;
      const sy = Math.sin(sa) * baseR * 0.21;
      const starR = 2.5 + lv * 0.3;
      ctx.beginPath();
      for (let j = 0; j < 5; j++) {
        const a2 = (j / 5) * Math.PI * 2 - Math.PI / 2;
        const px = sx + Math.cos(a2) * starR;
        const py = sy + Math.sin(a2) * starR;
        const ix = sx + Math.cos(a2 + Math.PI / 5) * starR * 0.45;
        const iy = sy + Math.sin(a2 + Math.PI / 5) * starR * 0.45;
        j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        ctx.lineTo(ix, iy);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ── energy shield at lv >= 3 (much more visible) ──
  if (lv >= 3) {
    ctx.save();
    const shieldAlpha = 0.12 + (lv - 3) * 0.06 + Math.sin(now * 0.002) * 0.05;
    ctx.globalAlpha = shieldAlpha;
    ctx.strokeStyle = clr; ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.lineDashOffset = -now * 0.02;
    const shieldR = r * (1.1 + lv * 0.08);
    ctx.beginPath(); ctx.arc(0, -r * 0.1, shieldR, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    // glow ring fill
    ctx.globalAlpha = shieldAlpha * 0.3;
    const sgG = ctx.createRadialGradient(0, -r * 0.1, shieldR * 0.85, 0, -r * 0.1, shieldR);
    sgG.addColorStop(0, 'transparent');
    sgG.addColorStop(1, clr);
    ctx.fillStyle = sgG;
    ctx.beginPath(); ctx.arc(0, -r * 0.1, shieldR, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ──────────── TYPE-SPECIFIC BODY ────────────

  if (type.id === 'blaster') {
    // ═══ BLASTER — armored rotating autocannon emplacement ═══
    const bodyH = r * (0.55 + lv * 0.08);
    // armored housing with beveled edges
    const hG = ctx.createLinearGradient(-r * 0.35, 0, r * 0.35, 0);
    hG.addColorStop(0, '#1a1a34'); hG.addColorStop(0.3, '#2e2e52'); hG.addColorStop(0.7, '#323260'); hG.addColorStop(1, '#161630');
    ctx.fillStyle = hG;
    ctx.beginPath();
    ctx.moveTo(-r * 0.3, 0);
    ctx.lineTo(-r * 0.34, -bodyH * 0.15);
    ctx.lineTo(-r * 0.3, -bodyH);
    ctx.lineTo(r * 0.3, -bodyH);
    ctx.lineTo(r * 0.34, -bodyH * 0.15);
    ctx.lineTo(r * 0.3, 0);
    ctx.closePath(); ctx.fill();
    // rim highlight
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-r * 0.3, -bodyH); ctx.lineTo(r * 0.3, -bodyH); ctx.stroke();
    // panel lines
    ctx.strokeStyle = clr + '20'; ctx.lineWidth = 0.5;
    for (let i = 1; i <= 2; i++) {
      const ly = -bodyH * i * 0.33;
      ctx.beginPath(); ctx.moveTo(-r * 0.28, ly); ctx.lineTo(r * 0.28, ly); ctx.stroke();
    }
    // vent slits
    ctx.fillStyle = clr + '15';
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(-r * 0.25 + i * r * 0.18, -bodyH * 0.6, r * 0.06, r * 0.03);
    }
    // turret head
    ctx.save();
    ctx.translate(0, -bodyH);
    // armored dome
    const domeR = r * 0.28 + lv * 1.8;
    const dG = ctx.createRadialGradient(-domeR * 0.3, -domeR * 0.3, 0, 0, 0, domeR);
    dG.addColorStop(0, '#3e3e66'); dG.addColorStop(0.7, '#262644'); dG.addColorStop(1, '#161630');
    ctx.fillStyle = dG;
    ctx.beginPath(); ctx.arc(0, 0, domeR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = clr + '40'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, domeR, 0, Math.PI * 2); ctx.stroke();
    // rivet dots
    for (let i = 0; i < 6; i++) {
      const ra = (i / 6) * Math.PI * 2;
      ctx.fillStyle = '#3a3a5a';
      ctx.beginPath(); ctx.arc(Math.cos(ra) * domeR * 0.78, Math.sin(ra) * domeR * 0.78, 1.2, 0, Math.PI * 2); ctx.fill();
    }
    // barrels
    ctx.save(); ctx.rotate(angle);
    const bCount = lv >= 3 ? 3 : lv >= 1 ? 2 : 1;
    const bSpacing = r * 0.09;
    for (let b = 0; b < bCount; b++) {
      const by = (b - (bCount - 1) / 2) * bSpacing;
      const bLen = r * (0.65 + lv * 0.07);
      // barrel body
      const bbG = ctx.createLinearGradient(r * 0.1, by - r * 0.045, r * 0.1, by + r * 0.045);
      bbG.addColorStop(0, '#4a4a6e'); bbG.addColorStop(0.5, '#323250'); bbG.addColorStop(1, '#24243e');
      ctx.fillStyle = bbG;
      ctx.beginPath(); ctx.roundRect(r * 0.1, by - r * 0.045, bLen, r * 0.09, 1); ctx.fill();
      // barrel tip highlight
      ctx.fillStyle = clr;
      ctx.shadowColor = clr; ctx.shadowBlur = 3 + lv * 2;
      ctx.beginPath(); ctx.arc(r * 0.1 + bLen, by, r * (0.03 + lv * 0.005), 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      // barrel groove
      ctx.strokeStyle = '#0a0a18'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(r * 0.2, by); ctx.lineTo(r * 0.1 + bLen - r * 0.05, by); ctx.stroke();
    }
    ctx.restore();
    // center core
    ctx.fillStyle = clr;
    ctx.shadowColor = clr; ctx.shadowBlur = (8 + lv * 4) * pulse;
    ctx.beginPath(); ctx.arc(0, 0, r * (0.09 + lv * 0.01), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-r * 0.02, -r * 0.02, r * 0.035, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

  } else if (type.id === 'machinegun') {
    // ═══ MACHINEGUN — коробчатый ресивер, лента, двойной ствол с рёбрами охлаждения ═══
    const bodyH = r * (0.48 + lv * 0.06);
    // коробчатый корпус (прямоугольный, не купол)
    const mgG = ctx.createLinearGradient(-r * 0.4, 0, r * 0.4, 0);
    mgG.addColorStop(0, '#0f1f0f'); mgG.addColorStop(0.3, '#1a321a'); mgG.addColorStop(0.7, '#1e3a1e'); mgG.addColorStop(1, '#0f1f0f');
    ctx.fillStyle = mgG;
    ctx.beginPath();
    ctx.moveTo(-r * 0.35, 0);
    ctx.lineTo(-r * 0.38, -bodyH * 0.15);
    ctx.lineTo(-r * 0.35, -bodyH);
    ctx.lineTo(r * 0.35, -bodyH);
    ctx.lineTo(r * 0.38, -bodyH * 0.15);
    ctx.lineTo(r * 0.35, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = clr + '50'; ctx.lineWidth = 1.2;
    ctx.stroke();
    // патронная лента (слева, идёт к стволам)
    ctx.strokeStyle = '#4a5a2a'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r * 0.45, -bodyH * 0.4);
    ctx.lineTo(-r * 0.2, -bodyH * 0.85);
    ctx.lineTo(r * 0.05, -bodyH * 0.9);
    ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      const lx = -r * 0.45 + t * (r * 0.5);
      const ly = -bodyH * 0.4 + t * (-bodyH * 0.5);
      ctx.fillStyle = '#5a6a3a';
      ctx.beginPath(); ctx.arc(lx, ly, 2, 0, Math.PI * 2); ctx.fill();
    }
    // барабан с лентой
    ctx.fillStyle = '#152015';
    ctx.beginPath(); ctx.arc(-r * 0.48, -bodyH * 0.35, r * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a4a2a'; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = clr + '30';
    ctx.beginPath(); ctx.arc(-r * 0.48, -bodyH * 0.35, r * 0.12, 0, Math.PI * 2); ctx.fill();
    // ресивер (прямоугольная «голова»)
    ctx.save();
    ctx.translate(0, -bodyH);
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(-r * 0.28, -r * 0.2, r * 0.56, r * 0.4);
    ctx.strokeStyle = clr + '55'; ctx.lineWidth = 1;
    ctx.strokeRect(-r * 0.28, -r * 0.2, r * 0.56, r * 0.4);
    // двойной ствол с рёбрами охлаждения
    ctx.save(); ctx.rotate(angle);
    const bSpacing = r * 0.1;
    for (let b = 0; b < 2; b++) {

    // coil rings with metallic look
    const coilCount = 3 + lv;
    for (let i = 0; i < coilCount; i++) {
      const cy2 = -pylonH * (0.15 + i * 0.78 / coilCount);
      const cw = r * 0.2 - (i * r * 0.008);
      ctx.strokeStyle = '#3a3a5e'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, cy2, cw, cw * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = clr + '35'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.ellipse(0, cy2, cw, cw * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
    }
    // energy arcs
    ctx.save();
    ctx.strokeStyle = clr; ctx.lineWidth = 1;
    const arcCount = 2 + lv;
    for (let i = 0; i < arcCount; i++) {
      const ay = -pylonH * (0.3 + Math.sin(now * 0.005 + i * 1.3) * 0.28);
      const ax = (Math.sin(now * 0.007 + i * 2.1)) * r * 0.32;
      ctx.globalAlpha = 0.25 + Math.sin(now * 0.008 + i) * 0.18;
      ctx.beginPath(); ctx.moveTo(0, ay);
      const mx = ax * 0.5 + Math.sin(now * 0.01 + i) * r * 0.08;
      const my = ay + (ay > -pylonH * 0.5 ? -r * 0.08 : r * 0.08);
      ctx.quadraticCurveTo(mx, my, ax, ay + Math.sin(now * 0.006 + i * 0.7) * r * 0.12);
      ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha = 1;
    // reactor orb
    const orbR = r * (0.16 + lv * 0.025);
    ctx.save();
    ctx.translate(0, -pylonH);
    const oG = ctx.createRadialGradient(-orbR * 0.25, -orbR * 0.25, 0, 0, 0, orbR);
    oG.addColorStop(0, '#fff');
    oG.addColorStop(0.2, lightenColor(clr, 0.4));
    oG.addColorStop(0.7, clr);
    oG.addColorStop(1, darkenColor(clr, 0.2));
    ctx.fillStyle = oG;
    ctx.shadowColor = clr; ctx.shadowBlur = (14 + lv * 6) * pulse;
    ctx.beginPath(); ctx.arc(0, 0, orbR, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // orb corona ring
    ctx.strokeStyle = clr + '40'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(0, 0, orbR * 1.4, 0, Math.PI * 2); ctx.stroke();
    // aiming arc
    ctx.save(); ctx.rotate(angle);
    ctx.strokeStyle = clr; ctx.lineWidth = 1.2;
    ctx.globalAlpha = 0.45 * pulse;
    const aimLen = r * (0.5 + lv * 0.08);
    ctx.beginPath(); ctx.moveTo(orbR, 0);
    ctx.lineTo(aimLen, Math.sin(now * 0.02) * r * 0.04);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.restore();
  }

  // ── ownership ring (multiplayer) ──
  if (ownerTint) {
    ctx.strokeStyle = ownerTint;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 6 + (i / 6) * Math.PI * 2;
      const hx = Math.cos(a) * baseR * 1.06, hy = Math.sin(a) * baseR * 0.37;
      i === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
    }
    ctx.closePath(); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function colorAlpha(color, alpha) {
  const a = typeof alpha === 'number' ? alpha : parseInt(alpha, 16) / 255;
  if (color.startsWith('hsl')) {
    const m = color.match(/hsl\(([^,]+),\s*([^,]+),\s*([^)]+)\)/);
    if (m) return `hsla(${m[1]},${m[2]},${m[3]},${a.toFixed(2)})`;
  }
  if (color.startsWith('rgb')) {
    const m = color.match(/rgb\(([^)]+)\)/);
    if (m) return `rgba(${m[1]},${a.toFixed(2)})`;
  }
  if (color.startsWith('#') && color.length >= 7) {
    const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
    return `rgba(${r},${g},${b},${a.toFixed(2)})`;
  }
  return color;
}

function lightenColor(color, amount) {
  try {
    if (color.startsWith('hsl')) {
      const m = color.match(/hsl\((\d+),\s*(\d+)%?,\s*(\d+)%?\)/);
      if (m) {
        const l = Math.min(100, parseInt(m[3]) + amount * 40);
        return `hsl(${m[1]},${m[2]}%,${Math.floor(l)}%)`;
      }
      return color;
    }
    const c = color.replace('#', '');
    let r = parseInt(c.substring(0, 2), 16);
    let g = parseInt(c.substring(2, 4), 16);
    let b = parseInt(c.substring(4, 6), 16);
    r = Math.min(255, Math.floor(r + (255 - r) * amount));
    g = Math.min(255, Math.floor(g + (255 - g) * amount));
    b = Math.min(255, Math.floor(b + (255 - b) * amount));
    return `rgb(${r},${g},${b})`;
  } catch { return color; }
}

function darkenColor(color, amount) {
  try {
    if (color.startsWith('hsl')) {
      const m = color.match(/hsl\((\d+),\s*(\d+)%?,\s*(\d+)%?\)/);
      if (m) {
        const l = Math.max(0, parseInt(m[3]) - amount * 30);
        return `hsl(${m[1]},${m[2]}%,${Math.floor(l)}%)`;
      }
      return color;
    }
    return shiftColor(color, -amount);
  } catch { return color; }
}

// Procedural terrain noise for decoration (логические row 0..ROWS+ROW_OFFSET)
const terrainSeed = Array.from({length: COLS * (ROWS + ROW_OFFSET + 1)}, () => Math.random());
function terrainNoise(c, r) { return terrainSeed[r * COLS + c] || 0; }

function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = canvas.width / dpr;
  const H = canvas.height / dpr;
  const now = performance.now();

  // reset transform, clear entire canvas, then restore dpr scaling
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // bg — deep sky gradient
  const bgG = ctx.createLinearGradient(0, 0, 0, H);
  bgG.addColorStop(0, '#0a0a20');
  bgG.addColorStop(0.4, '#0f0f2a');
  bgG.addColorStop(1, '#08081a');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  // distant stars
  ctx.fillStyle = 'rgba(200,220,255,.3)';
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 137.5) % W);
    const sy = ((i * 73.1 + 11) % (H * 0.4));
    const twinkle = Math.sin(now * 0.001 + i * 2.3) * 0.5 + 0.5;
    ctx.globalAlpha = 0.1 + twinkle * 0.4;
    ctx.beginPath();
    ctx.arc(sx, sy, 0.8 + twinkle * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(camX, camY);

  // ── dark border outside the grid (prevents seeing past map edges) ──
  const gridLeft = OX, gridTop = OY;
  const gridRight = OX + COLS * CELL, gridBottom = OY + ROWS * CELL;
  ctx.fillStyle = '#08081a';
  ctx.fillRect(gridLeft - 2000, gridTop - 2000, 2000, ROWS * CELL + 4000); // left
  ctx.fillRect(gridRight, gridTop - 2000, 2000, ROWS * CELL + 4000);       // right
  ctx.fillRect(gridLeft - 2000, gridTop - 2000, COLS * CELL + 4000, 2000); // top
  ctx.fillRect(gridLeft - 2000, gridBottom, COLS * CELL + 4000, 2000);     // bottom

  // ── TERRAIN TILES ──
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = OX + c * CELL;
      const y = OY + r * CELL;
      const onPath = isPath(c, r + ROW_OFFSET);
      const noise = terrainNoise(c, r + ROW_OFFSET);

      if (onPath) {
        const pulse = Math.sin(now * 0.002 + (c + r) * 0.4) * 0.3 + 0.5;
        const pathGrad = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
        pathGrad.addColorStop(0, `rgba(55,100,140,${0.7 + pulse * 0.1})`);
        pathGrad.addColorStop(1, `rgba(48,82,125,${0.8 + pulse * 0.05})`);
        ctx.fillStyle = pathGrad;
      } else {
        const g = Math.floor(70 + noise * 30);
        const b2 = Math.floor(62 + noise * 24);
        ctx.fillStyle = `rgb(${Math.floor(58 + noise * 20)},${g},${b2})`;
      }
      ctx.fillRect(x, y, CELL, CELL);

      // subtle inner shadow on terrain tiles (bottom-right edges)
      if (!onPath) {
        ctx.fillStyle = 'rgba(0,0,0,.08)';
        ctx.fillRect(x, y + CELL - 1, CELL, 1);
        ctx.fillRect(x + CELL - 1, y, 1, CELL);
        ctx.fillStyle = 'rgba(255,255,255,.03)';
        ctx.fillRect(x, y, CELL, 1);
        ctx.fillRect(x, y, 1, CELL);
      }

      // grid lines
      ctx.strokeStyle = onPath ? 'rgba(0,180,255,.08)' : 'rgba(60,80,60,.06)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x, y, CELL, CELL);

      // grass tufts on non-path tiles
      if (!onPath && noise > 0.5) {
        const gx = x + CELL * (0.3 + noise * 0.4);
        const gy = y + CELL * 0.85;
        ctx.strokeStyle = `rgba(40,${100 + Math.floor(noise * 60)},50,.3)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(gx, gy); ctx.lineTo(gx - 2, gy - CELL * 0.12);
        ctx.moveTo(gx + 3, gy); ctx.lineTo(gx + 4, gy - CELL * 0.1);
        ctx.moveTo(gx + 6, gy); ctx.lineTo(gx + 5, gy - CELL * 0.14);
        ctx.stroke();
      }

      // path engraved runes
      if (onPath) {
        const runeAlpha = Math.sin(now * 0.0015 + c * 0.7 + r * 1.1) * 0.3 + 0.3;
        ctx.strokeStyle = `rgba(0,200,255,${runeAlpha * 0.15})`;
        ctx.lineWidth = 1;
        const rcx = x + CELL * 0.5, rcy = y + CELL * 0.5;
        ctx.beginPath();
        ctx.arc(rcx, rcy, CELL * 0.2, 0, Math.PI * (0.5 + noise));
        ctx.stroke();
      }
    }
  }

  // ── PATH ROADS with glow (draw all active paths) ──
  const allPaths = [pathPoints];
  for (const pp of allPaths) {
    if (pp.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(g2x(pp[0].x), g2y(pp[0].y));
    for (let i = 1; i < pp.length; i++) {
      ctx.lineTo(g2x(pp[i].x), g2y(pp[i].y));
    }
    ctx.strokeStyle = 'rgba(0,180,255,.06)';
    ctx.lineWidth = CELL * 0.7;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();

    ctx.strokeStyle = 'rgba(0,160,220,.12)';
    ctx.lineWidth = CELL * 0.35;
    ctx.stroke();

    ctx.setLineDash([CELL * 0.2, CELL * 0.15]);
    ctx.lineDashOffset = -now * 0.02;
    ctx.strokeStyle = 'rgba(0,220,255,.18)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── PORTALS (шестиугольники, частицы, шиммер, золотые акценты) ──
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  function drawHex(cx, cy, r, fill) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i * 60 - 90) * Math.PI / 180;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    if (fill) ctx.fill(); ctx.stroke();
  }
  function drawPortalParticles(cx, cy, color, count, dir) {
    for (let i = 0; i < count; i++) {
      const phase = (now * 0.0012 + i * 0.8) % 1;
      const dist = CELL * (0.15 + phase * 0.4);
      const angle = (i / count) * Math.PI * 2 + now * 0.0005;
      const px = cx + Math.cos(angle) * dist;
      const py = cy + (dir > 0 ? -1 : 1) * Math.sin(angle) * dist;
      const alpha = (1 - phase) * 0.25;
      const size = 1.5;
      ctx.fillStyle = color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
      ctx.beginPath(); ctx.arc(px, py, size, 0, Math.PI * 2); ctx.fill();
    }
  }

  // entrance portal — сдержанный дизайн
  for (const pp of allPaths) {
    if (pp.length === 0) continue;
    const epx = g2x(pp[0].x), epy = g2y(pp[0].y);
    const pulse = Math.sin(now * 0.002) * 0.08 + 0.5;
    const R = CELL * 0.42;
    const cellX = epx - CELL / 2, cellY = epy - CELL / 2;
    const cellGrad = ctx.createLinearGradient(cellX, cellY, cellX + CELL, cellY + CELL);
    cellGrad.addColorStop(0, `rgba(45,85,115,${0.85 + pulse})`);
    cellGrad.addColorStop(0.5, `rgba(55,100,135,${0.8 + pulse})`);
    cellGrad.addColorStop(1, `rgba(40,75,105,${0.85 + pulse})`);
    ctx.fillStyle = cellGrad;
    ctx.fillRect(cellX, cellY, CELL, CELL);
    drawPortalParticles(epx, epy, 'rgb(120,180,200)', 4, 1);
    const glowGrad = ctx.createRadialGradient(epx, epy, 0, epx, epy, CELL * 1.1);
    glowGrad.addColorStop(0, 'rgba(80,140,170,.12)');
    glowGrad.addColorStop(0.6, 'rgba(60,120,150,.04)');
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath(); ctx.arc(epx, epy, CELL * 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(100,160,190,.5)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(cellX + 1, cellY + 1, CELL - 2, CELL - 2);
    ctx.strokeStyle = `rgba(90,150,180,${0.4 + Math.sin(now * 0.003) * 0.1})`;
    ctx.lineWidth = 2;
    drawHex(epx, epy, R, false);
    ctx.fillStyle = `rgba(25,55,75,${0.9})`;
    drawHex(epx, epy, R * 0.65, true);
    ctx.strokeStyle = 'rgba(80,140,170,.4)'; ctx.lineWidth = 1;
    drawHex(epx, epy, R * 0.65, false);
    ctx.fillStyle = 'rgba(140,200,220,.95)';
    ctx.font = `bold ${CELL * 0.45}px sans-serif`;
    ctx.fillText('▶', epx, epy);
  }

  // exit fortress — сдержанный дизайн (в тон старту)
  if (pathPoints.length > 0) {
    const lp = pathPoints[pathPoints.length - 1];
    const lpx = g2x(lp.x), lpy = g2y(lp.y);
    const pulse = Math.sin(now * 0.002 + 1) * 0.08 + 0.5;
    const R = CELL * 0.42;
    const cellX = lpx - CELL / 2, cellY = lpy - CELL / 2;
    const cellGrad = ctx.createLinearGradient(cellX, cellY, cellX + CELL, cellY + CELL);
    cellGrad.addColorStop(0, `rgba(95,45,55,${0.85 + pulse})`);
    cellGrad.addColorStop(0.5, `rgba(110,55,65,${0.8 + pulse})`);
    cellGrad.addColorStop(1, `rgba(85,35,45,${0.85 + pulse})`);
    ctx.fillStyle = cellGrad;
    ctx.fillRect(cellX, cellY, CELL, CELL);
    drawPortalParticles(lpx, lpy, 'rgb(180,120,130)', 4, -1);
    const glowGrad = ctx.createRadialGradient(lpx, lpy, 0, lpx, lpy, CELL * 1.1);
    glowGrad.addColorStop(0, 'rgba(140,80,90,.1)');
    glowGrad.addColorStop(0.6, 'rgba(120,60,70,.03)');
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath(); ctx.arc(lpx, lpy, CELL * 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(140,90,100,.5)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(cellX + 1, cellY + 1, CELL - 2, CELL - 2);
    ctx.strokeStyle = `rgba(150,95,105,${0.4 + Math.sin(now * 0.003) * 0.1})`;
    ctx.lineWidth = 2;
    drawHex(lpx, lpy, R, false);
    ctx.fillStyle = `rgba(45,25,30,${0.9})`;
    drawHex(lpx, lpy, R * 0.65, true);
    ctx.strokeStyle = 'rgba(130,85,95,.4)'; ctx.lineWidth = 1;
    drawHex(lpx, lpy, R * 0.65, false);
    ctx.fillStyle = 'rgba(200,150,160,.95)';
    ctx.font = `bold ${CELL * 0.45}px sans-serif`;
    ctx.fillText('🏠', lpx, lpy);
  }

  // ── HOVER PREVIEW ──
  if (selectedType && hoverCol >= 0 && hoverCol < COLS && hoverRow >= 0 && hoverRow < ROWS) {
    const type = TOWER_TYPES.find(t => t.id === selectedType);
    const hx = OX + hoverCol * CELL, hy = OY + hoverRow * CELL;
    const lr = hoverRow + ROW_OFFSET;
    const valid = !isPath(hoverCol, lr) && !towers.find(t => t.col === hoverCol && t.row === lr);

    ctx.fillStyle = valid ? 'rgba(0,200,255,.15)' : 'rgba(255,60,90,.15)';
    ctx.fillRect(hx, hy, CELL, CELL);
    ctx.strokeStyle = valid ? 'rgba(0,200,255,.5)' : 'rgba(255,60,90,.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(hx + 1, hy + 1, CELL - 2, CELL - 2);

    if (valid) {
      ctx.strokeStyle = `${type.color}33`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(hx + CELL / 2, hy + CELL / 2, type.range * CELL, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // ── TOWERS ──
  const MY_TINT = '#00e0ff', ALLY_TINT = '#ff8f3c';
  for (const t of towers) {
    const type = TOWER_TYPES.find(tp => tp.id === t.typeId);
    if (!type) continue;
    const cx = g2x(t.col + 0.5), cy = g2y(t.row + 0.5);
    const cellX = g2x(t.col), cellY = g2y(t.row);
    const isMine = !isMulti() || !t.ownerId || t.ownerId === (isHost ? 'host' : 'guest');
    const ownerTint = isMulti() ? (isMine ? MY_TINT : ALLY_TINT) : null;

    drawTower(cx, cy, CELL * 1.3, type, t.level, t.angle, now, ownerTint);

    // selected range
    if (selectedTower === t) {
      ctx.strokeStyle = type.color + '44';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(cx, cy, t.range * CELL, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = '#00e0ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(cellX, cellY, CELL, CELL);
    }

    // beam
    const beamTarget = t.target || (t.targetId ? enemies.find(e2 => e2.id === t.targetId) : null);
    if (type.beam && beamTarget && beamTarget.hp > 0 && beamTarget.spawned) {
      ctx.save();
      const btx = g2x(beamTarget.x), bty = g2y(beamTarget.y);
      ctx.strokeStyle = type.color;
      ctx.lineWidth = 5;
      ctx.globalAlpha = 0.9;
      const beamOY = cy - CELL * 0.35;
      ctx.beginPath(); ctx.moveTo(cx, beamOY); ctx.lineTo(btx, bty); ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.globalAlpha = .4;
      ctx.beginPath(); ctx.moveTo(cx, beamOY); ctx.lineTo(btx, bty); ctx.stroke();
      ctx.restore();
    }
  }

  // ── ENEMIES ──
  for (const e of enemies) {
    if (!e.spawned || e.hp <= 0) continue;
    const ex = g2x(e.x), ey = g2y(e.y);
    const eRadius = CELL * (e.type === 'boss' ? 0.68 : 0.48);

    let facing = 1;
    const eFacePath = getPathFor(e);
    if (e.pathIdx < eFacePath.length - 1) {
      const np = eFacePath[e.pathIdx + 1];
      const cp = eFacePath[e.pathIdx];
      facing = (np.x - cp.x) >= 0 ? 1 : (np.x - cp.x) < 0 ? -1 : (np.y > cp.y ? 1 : -1);
    }

    const walkPhase = now * 0.0015 + e.pathIdx * 0.5 + e.pathT * 3;
    const dc = darkenColor(e.color, 0.35);
    const isSlowed = now < e.slowEnd;

    drawEnemy(ex, ey, eRadius, e.color, dc, now, walkPhase, facing, e.type === 'boss', isSlowed, e.variant || 'runner');

    // hp bar
    const barW = CELL * 0.6, barH = 3.5;
    const bx = ex - barW / 2, by = ey - eRadius * 1.5;
    const hpRatio = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.roundRect(bx - 1, by - 1, barW + 2, barH + 2, 2); ctx.fill();
    const hpColor = hpRatio > 0.5 ? '#44ff88' : hpRatio > 0.25 ? '#ffaa22' : '#ff3344';
    const hpG = ctx.createLinearGradient(bx, 0, bx + barW * hpRatio, 0);
    hpG.addColorStop(0, hpColor);
    hpG.addColorStop(1, lightenColor(hpColor, 0.2));
    ctx.fillStyle = hpG;
    ctx.beginPath(); ctx.roundRect(bx, by, Math.max(0, barW * hpRatio), barH, 1.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(bx, by, Math.max(0, barW * hpRatio), barH * 0.35);
  }

  // (machinegun uses muzzle flash particles, no tracers)

  // ── PROJECTILES ──
  for (const p of projectiles) {
    if (p.typeId === 'machinegun') continue;
    const ppx = g2x(p.x), ppy = g2y(p.y);
    const color = p.color;
    const pSize = CELL * 0.14;

    // wide glow
    const projGlow = ctx.createRadialGradient(ppx, ppy, 0, ppx, ppy, pSize * 3);
    projGlow.addColorStop(0, color + '88');
    projGlow.addColorStop(0.4, color + '33');
    projGlow.addColorStop(1, color + '00');
    ctx.fillStyle = projGlow;
    ctx.beginPath(); ctx.arc(ppx, ppy, pSize * 3, 0, Math.PI * 2); ctx.fill();

    // colored orb
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(ppx, ppy, pSize, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // bright core
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ppx, ppy, pSize * 0.45, 0, Math.PI * 2); ctx.fill();
  }

  // ── PARTICLES ──
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

}

function shiftColor(hex, amount) {
  try {
    let r, g, b;
    if (hex.startsWith('hsl')) {
      return hex;
    }
    const c = hex.replace('#', '');
    r = parseInt(c.substring(0, 2), 16);
    g = parseInt(c.substring(2, 4), 16);
    b = parseInt(c.substring(4, 6), 16);
    r = Math.max(0, Math.min(255, Math.floor(r * (1 + amount))));
    g = Math.max(0, Math.min(255, Math.floor(g * (1 + amount))));
    b = Math.max(0, Math.min(255, Math.floor(b * (1 + amount))));
    return `rgb(${r},${g},${b})`;
  } catch { return hex; }
}

function endGame() {
  gameOver = true;
  if (isMulti() && isHost && db && roomId) {
    db.ref('rooms/' + roomId + '/state').update({ gameOver: true });
  }
  document.getElementById('game-over').querySelector('.go-title').textContent = 'Game Over';
  document.getElementById('game-over').querySelector('.go-sub').textContent = 'Your fortress has fallen';
  document.getElementById('goStats').textContent = `Survived ${waveNum} waves`;
  document.getElementById('game-over').classList.add('visible');
  playSfx('gameOver', .8);
  stopMusic();
}

let bgTimer = 0;
const BG_STEP = 3;

function tick() {
  const now = performance.now();
  let raw = (now - lastTime) / 16.667;
  lastTime = now;

  if (bgTimer && raw > BG_STEP) {
    let steps = Math.floor(raw / BG_STEP);
    const remainder = raw - steps * BG_STEP;
    while (steps-- > 0 && !gameOver) update(BG_STEP);
    raw = remainder;
  }

  const dt = Math.min(raw, BG_STEP);
  if (!gameOver) update(dt);
  if (!document.hidden) draw();
  updateUI();
  updateWaveTimer();
}

function frame() {
  requestAnimationFrame(frame);
  if (!bgTimer) tick();
}

function startBgLoop() {
  if (bgTimer) return;
  bgTimer = setInterval(tick, 200);
}

function stopBgLoop() {
  if (!bgTimer) return;
  clearInterval(bgTimer);
  bgTimer = 0;
  lastTime = performance.now();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && isMulti() && isHost) {
    startBgLoop();
  } else {
    stopBgLoop();
  }
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
resize();

function getRoomFromUrl() {
  const m = location.search.match(/room=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

function initFirebase() {
  if (db) return true;
  try {
    if (typeof firebase !== 'undefined' && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY') {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      return true;
    }
  } catch (e) { console.warn('Firebase init failed', e); }
  return false;
}

const rid = getRoomFromUrl();
if (rid) {
  roomId = rid;
  if (initFirebase() && db) {
    document.getElementById('btnStart').onclick = () => {
      document.getElementById('lobby').classList.add('hidden');
      musicInGame = true;
      initGame();
    };
    function copyLink() {
      const link = document.getElementById('shareLink').textContent;
      if (!link) return;
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.getElementById('btnCopy');
        btn.textContent = '✅ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy'; }, 1500);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = link;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        const btn = document.getElementById('btnCopy');
        btn.textContent = '✅ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy'; }, 1500);
      });
    }
    document.getElementById('btnCopy').onclick = copyLink;
    document.getElementById('shareLink').onclick = copyLink;
    db.ref('rooms/' + roomId).on('value', snap => {
      const data = snap.val();
      if (!data) {
        document.getElementById('lobbyErr').textContent = 'Room not found';
        return;
      }
      isHost = data.hostId === clientId;
      if (!isHost && data.guestId !== clientId) {
        db.ref('rooms/' + roomId).update({ guestId: clientId });
      }
      if (data.gameStarted && data.state) {
        const wasStarted = gameStarted;
        if (!gameStarted) {
          gameStarted = true;
          buildShop();
          document.getElementById('wave-btn').style.display = 'none';
          if (isHost) {
            applySnapshot(data);
          }
        }
        if (isHost) {
          pendingIntents = data.intents || {};
        } else {
          applySnapshot(data);
        }
        musicInGame = true;
        document.getElementById('lobby').classList.add('hidden');
        if (musicEnabled) startMusic();
      } else if (isHost) {
        document.getElementById('lobbyShare').style.display = 'block';
        document.querySelectorAll('#lobby .row').forEach(el => { el.style.display = 'none'; });
        document.getElementById('shareLink').textContent = location.origin + location.pathname + '?room=' + roomId;
        document.getElementById('waitingText').textContent = data.guestId ? 'Player 2 joined!' : 'Waiting for player 2...';
        document.getElementById('btnStart').style.display = data.guestId ? 'block' : 'none';
      } else {
        document.getElementById('lobbyGuest').style.display = 'block';
        document.querySelectorAll('#lobby .row').forEach(el => { el.style.display = 'none'; });
      }
    });
  } else {
    document.getElementById('lobbyErr').textContent = 'Firebase not configured. Set FIREBASE_CONFIG in game.html.';
  }
  document.getElementById('lobby').classList.remove('hidden');
} else {
  document.getElementById('lobby').classList.remove('hidden');
  document.getElementById('btnCreate').onclick = () => {
    if (!initFirebase()) {
      document.getElementById('lobbyErr').textContent = 'Firebase not configured. Set FIREBASE_CONFIG in game.html.';
      return;
    }
    document.getElementById('lobbyErr').textContent = '';
    const ref = db.ref('rooms').push({ hostId: clientId, guestId: null });
    roomId = ref.key;
    ref.then(() => {
      window.location = location.origin + location.pathname + '?room=' + roomId;
    }).catch(err => {
      document.getElementById('lobbyErr').textContent = 'Ошибка: ' + (err.message || err);
    });
  };
  document.getElementById('btnSolo').onclick = () => {
    document.getElementById('lobby').classList.add('hidden');
    musicInGame = true;
    initGame();
  };
  document.getElementById('btnJoin').onclick = () => {
    const input = document.getElementById('joinInput').value.trim();
    let id = input;
    const match = input.match(/room=([^&]+)/);
    if (match) id = decodeURIComponent(match[1]);
    if (!id) { document.getElementById('lobbyErr').textContent = 'Enter room link or ID'; return; }
    window.location = location.origin + location.pathname + '?room=' + encodeURIComponent(id);
  };
  document.getElementById('btnCopy').onclick = () => {
    navigator.clipboard.writeText(document.getElementById('shareLink').textContent);
  };
    document.getElementById('btnStart').onclick = () => {
      document.getElementById('lobby').classList.add('hidden');
      musicInGame = true;
      initGame();
    };
  initGame();
}

requestAnimationFrame(frame);
</script>
